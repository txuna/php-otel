apiVersion: v1
kind: ConfigMap
metadata:
  name: fpm-nginx-config
  labels:
    {{- include "php-fpm.labels" . | nindent 4 }}
data:
  nginx-default.conf: |
    server {
        listen {{ .Values.stack.nginx.port }};
        server_name _;

        root /var/www/html;
        index gateway.php;

        location / {
            try_files $uri /gateway.php$is_args$args;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:{{ .Values.stack.fpm.port }};
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }

  zz-app.conf: |
    [global]
    error_log = /proc/self/fd/2

    [www]
    access.log = /proc/self/fd/2
    catch_workers_output = yes
    decorate_workers_output = no

    ; OTEL_* 같은 환경변수를 PHP가 볼 수 있게 한다
    clear_env = no

    ; 메모리 limit(128Mi)에 맞춰 워커 수를 고정
    pm = static
    pm.max_children = {{ .Values.stack.fpm.maxChildren }}
    pm.max_requests = {{ .Values.stack.fpm.maxRequests }}

  zz-app.ini: |
    memory_limit = 128M
    expose_php = Off
    display_errors = Off
    log_errors = On
    error_log = /proc/self/fd/2

    ; [opentelemetry]
    ; extension=opentelemetry.so

    auto_prepend_file = /var/www/html/telemetry.php

    OTEL_PHP_AUTOLOAD_ENABLED="true"
    OTEL_SERVICE_NAME=php-otel
    OTEL_TRACES_EXPORTER=otlp
    OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    ;OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
    OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger.telemetry.svc:4318
    OTEL_PROPAGATORS=baggage,tracecontext

    ; 전부 수집(기본은 부모 기반)
    OTEL_TRACES_SAMPLER=always_on
    ; span을 즉시 전송 - 요청이 짧은 PHP에서 확인이 빠름
    OTEL_PHP_TRACES_PROCESSOR=simple
    ; exporter가 왜 실패했는지 stdout 출력
    OTEL_LOG_LEVEL=debug

    OTEL_METRICS_EXPORTER=none
    OTEL_LOGS_EXPORTER=none